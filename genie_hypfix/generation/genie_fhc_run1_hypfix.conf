# GENIE Sigma0 QE overlay sample with the FIXED hyperon cross section (genie::HypQELTracePXSec,
# genie_gen/hypfix): NuMI FHC, run1 EXT (no CRT). The fixed-GENIE twin of fhc_run1; replaces
# genie_fhc_run1 (Pais cross section). Hepmc from genie_gen/submit_genie_hypfix.sh -b fhc, merged in
# batches (merge_genie_batch.sh) listed in hepmc_all.list. Shares the run1 EXT dir and stage list
# with fhc_run1; make_manifest.sh excludes every EXT file used by the other manifests, so no EXT
# event is shared. Use with SAMPLE=genie_fhc_run1_hypfix.
S_GENIEBASE=/data/uboone/genie_samples/genie_uboone_NuMI_FHC_sigmazero_run1_2026_hypfix
S_HEPMCLIST=$S_GENIEBASE/hepmc_all.list
S_EXT_DIMS="defname: prod_extunbiased_swizzle_inclusive_v3_goodruns_mcc9_run1_high_lifetime"
S_EXTDIR=/data/uboone/EXT_swizzle/numi_run1
S_STAGELIST=/data/uboone/EXT_swizzle/numi_run1/ext_pnfs_5k.list   # 5000 random run1 files (list_extra_ext.sh); prestage them
S_EXTLIST_LOCAL=ext_swizzle_run1_geniefix.filelist
S_EXTLIST=ext_unbiased_run1_geniefix.filelist
S_MANIFEST=manifest_genie_fhc_run1_hypfix.tsv
S_OUTBASE=/data/uboone/prod_geniefix_sigmazero_overlay_numi_fhc_run1_extunbiased_mcc9
S_JOBNAME=geniefixovlfhc
S_PELEE_FCL=run_neutrinoselectionfilter_run1_nuwro_cc0pinp_numi.fcl   # run1 overlay + ignoreMCFlux (hepmc input)
# run by topup_daemon.sh before every cycle: merge newly finished GENIE FHC chunks into a new batch
# (20 at a time while the generation array runs, then the rest)
S_PRECYCLE="genie_gen/merge_genie_batch.sh -m \$(squeue -h -u \"\$USER\" -n geniefixfhc | grep -q . && echo 20 || echo 1) $S_GENIEBASE"
S_DELETE_USED_EXT=0   # keep EXT (used for the Sigma analysis)
